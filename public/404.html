<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · Página não encontrada · Page not found — Braga 3D</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#14110d" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14110d; color: #f1e8da; font: 16px/1.5 Georgia, serif; text-align: center; }
      main { max-width: 520px; padding: 32px 24px; }
      .mark { width: 96px; height: 96px; margin: 0 auto 20px; display: block; }
      h1 { margin: 0 0 4px; font-size: 40px; font-weight: 600; }
      .alt { margin: 0 0 24px; color: #c9bba5; }
      a.go { display: inline-block; padding: 10px 22px; border: 1px solid #e0a948; border-radius: 999px; color: #e0a948; text-decoration: none; }
      a.go:hover, a.go:focus-visible { background: #e0a948; color: #14110d; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icons/icon.svg" width="96" height="96" alt="Braga 3D" />
      <h1>404</h1>
      <p class="alt">
        <span lang="pt-PT">Esta página não existe.</span><br />
        <span lang="en">This page does not exist.</span><br />
        <span lang="ru">Такой страницы нет.</span>
      </p>
      <a class="go" href="/">Abrir o mapa 3D · Open the 3D map · Открыть 3D-карту</a>
    </main>
  </body>
</html>
